name: CI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  pull_request:
  push:
    branches:
      - main
      - dev

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install lightweight dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m py_compile __init__.py utils.py nodes/*.py

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Check frontend JavaScript syntax
        run: |
          node --check web/index.js
          node --check web/js/lora_switcher.js
          node --check web/js/llm_aio.js
