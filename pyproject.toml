# pyproject.toml
[project]
name = "comfyui-oshtz-nodes"
description = "Custom ComfyUI nodes including LLM integration, GPT Image 1, LoRA switchers, aspect ratio helper, image tools, and more"
version = "1.2.0"
license = { file = "LICENSE.txt" }
requires-python = ">=3.10"
dependencies = [
    "requests",
    "pydantic",
    "Pillow",
    "numpy"
]
classifiers = [
    "Operating System :: OS Independent"
]

[project.urls]
Repository = "https://github.com/oshtz/ComfyUI-oshtz-nodes"
Documentation = "https://github.com/oshtz/ComfyUI-oshtz-nodes#readme"
"Bug Tracker" = "https://github.com/oshtz/ComfyUI-oshtz-nodes/issues"

[tool.comfy]
PublisherId = "oshtz"
DisplayName = "oshtz Nodes"
Icon = "https://github.com/oshtz.png"
requires-comfyui = ">=0.22.0"
